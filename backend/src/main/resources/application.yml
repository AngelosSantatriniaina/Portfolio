server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: portfolio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-this-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:5}MB
      max-request-size: ${MAX_UPLOAD_MB:5}MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-name: PORTFOLIO_AUTH
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  uploads:
    directory: ${UPLOAD_DIR:./uploads}
  contact:
    to: ${CONTACT_TO:angelossantatriniaina@gmail.com}
    from: ${MAIL_FROM:no-reply@example.com}
